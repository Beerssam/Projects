; Analog_Bridge.ini -- KF0RIZ AllStar <-> MMDVM_Bridge audio bridge
; Callsign: KF0RIZ | DMR ID: 3209686
; VERIFY the [USRP] port directionality against the working config that the
; `dvs` menu generates on YOUR box (sources disagree on which port goes in
; rpt.conf vs usrp.conf; the menu output is ground truth).

[GENERAL]
Callsign=KF0RIZ
Id=3209686
; DMR ID presented to the DMR networks
gatewayDmrId=3209686
; Repeater-style ESSID for the bridge leg (matches BM stanza)
repeaterID=320968601

[AMBE_AUDIO]
server=127.0.0.1
; Must match MMDVM_Bridge.ini [General] RXPort/TXPort
fromPort=31100
toPort=31103

[USRP]
server=127.0.0.1
; ASL chan_usrp <-> Analog_Bridge (localhost, UDP)
; VERIFY directionality against your dvs-generated files.
toPort=32001
fromPort=34001
; Audio levels: start here, adjust on signal reports (#1 post-install complaint)
txGain=0.50
rxGain=0.50

[MACROS]
; Tune helper lives at /opt/MMDVM_Bridge/dvswitch.sh on the node:
;   sudo /opt/MMDVM_Bridge/dvswitch.sh tune <TG>
