; Analog_Bridge.ini -- KF0RIZ AllStar <-> MMDVM_Bridge audio bridge
; Callsign: KF0RIZ | DMR ID: 3209686
;
; Key names VERIFIED against the DVSwitch-distributed Analog_Bridge.ini
; (analog-bridge 1.6.4 package), Oct 2026. Note: this file has NO Callsign/Id
; keys -- the DMR identity comes from MMDVM_Bridge.ini.
;
; UPGRADING AN EXISTING WORKING DVSWITCH INSTALL? The [USRP] ports below are
; the common convention (matching rpt.conf "usrp/127.0.0.1:34001:32001").
; If your node already bridges audio fine, KEEP your existing [USRP] values
; from the dvs-generated file instead -- only the DMRGateway/MMDVM_Bridge
; side changes for multi-mode.

[GENERAL]
logLevel = 2

[AMBE_AUDIO]
address = 127.0.0.1
txPort = 31103
rxPort = 31100
ambeMode = DMR
; Must pair with DVSwitch.ini [DMR] on the MMDVM_Bridge side:
;   AB txPort (31103) -> MM rxPort (31103) ; AB rxPort (31100) <- MM txPort (31100)
; The stock DVSwitch.ini already has these values -- do not change them.

; Metadata used when ASL is the audio source
gatewayDmrId = 3209686
repeaterID = 320968601
txTg = 9
txTs = 2
colorCode = 1

[USRP]
address = 127.0.0.1
txPort = 32001
rxPort = 34001
usrpAudio = AUDIO_UNITY
tlvAudio = AUDIO_UNITY
; If audio reports come back hot/quiet, switch one side to AUDIO_USE_GAIN and
; tune usrpGain (digital->analog) / tlvGain (analog->digital). Start at unity.

[MACROS]
; Tune helper lives at /opt/MMDVM_Bridge/dvswitch.sh on the node:
;   sudo /opt/MMDVM_Bridge/dvswitch.sh tune <TG>
