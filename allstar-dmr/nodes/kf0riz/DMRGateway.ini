; DMRGateway.ini -- KF0RIZ multi-mode DMR (BrandMeister + TGIF)
; Callsign: KF0RIZ | DMR ID: 3209686
;
; BEFORE USING: replace __SET_BM_HOTSPOT_PASSWORD__ and __SET_TGIF_PASSWORD__
; with the real passwords. They are intentionally left as markers so no
; secret is ever committed to the repo.
;
; VERIFY the [DMR Network] client-side port pairing against the working
; single-network config that the `dvs` menu generates on YOUR box.
;
; Dialing:
;   Plain TGs (e.g. 91, 3104, 3120) -> BrandMeister (network 1)
;   4-prefixed TGs (e.g. 4000777)   -> TGIF TG 777 (network 2)

[General]
Callsign=KF0RIZ
Id=3209686
Timeout=10
Duplex=0
Debug=0
Daemon=0

[Log]
DisplayLevel=0
FileLevel=1
FilePath=/var/log/mmdvm
FileRoot=DMRGateway

; Client side: MMDVM_Bridge connects here (localhost).
; VERIFY: Local= must match MMDVM_Bridge.ini [DMR Network] Port=.
[DMR Network]
Enabled=1
Address=127.0.0.1
Port=62031
Local=62032
Password=passw0rd
Location=0
Debug=0

; --- Network 1: BrandMeister via 3103 San Jose (closest US master to Arizona) ---
[DMR Network 1]
Enabled=1
Name=BM_3103
Address=3103.repeater.net
Port=62031
Password="__SET_BM_HOTSPOT_PASSWORD__"
Id=320968601
TGRewrite1=1,1,1,1,999999
TGRewrite2=2,1,2,1,999999
PCRewrite1=1,9990,1,9990,1
PCRewrite2=2,9990,2,9990,1
TypeRewrite1=1,9990,1,9990
TypeRewrite2=2,9990,2,9990
SrcRewrite1=1,9990,1,1,999999
SrcRewrite2=2,9990,2,1,999999
Location=1
Debug=0

; --- Network 2: TGIF ---
[DMR Network 2]
Enabled=1
Name=TGIF_Network
Address=tgif.network
Port=62031
Password="__SET_TGIF_PASSWORD__"
Id=320968602
; 4000001-4999999 dialed on the AllStar side -> TGIF TGs 1-999999 (leading 4 stripped)
TGRewrite1=1,4000001,1,1,999999
TGRewrite2=2,4000001,2,1,999999
; Return-path mirror of the above. VERIFY on-air: if inbound caller IDs or
; talkgroups look wrong, these SrcRewrite lines are the first suspect.
SrcRewrite1=1,1,1,4000001,999999
SrcRewrite2=2,1,2,4000001,999999
Location=0
Debug=0

; --- Network 3: KS-DMR (OPTIONAL, disabled) ---
; KS-DMR is a standalone Kansas network (HBlink-based). Their public hotspot
; entry is vesta.k0usy.org:62071 with the published passphrase "KS-DMR", but:
;   * it only carries TS2 / TG 3120 (Kansas Statewide), and
;   * their policy asks that out-of-state users be in/near the Kansas border.
; You are in Arizona, and BM TG 3120 already gives you Kansas Statewide via
; the BrandMeister stanza above -- so this adds nothing unless you have a
; specific reason. Uncomment and enable if you want it anyway (uses the
; 7-prefix: dial 7000001-7999999 to reach KS-DMR TGs 1-999999).
;[DMR Network 3]
;Enabled=1
;Name=KSDMR
;Address=vesta.k0usy.org
;Port=62071
;Password="KS-DMR"
;Id=320968603
;TGRewrite1=1,7000001,1,1,999999
;TGRewrite2=2,7000001,2,1,999999
;SrcRewrite1=1,1,1,7000001,999999
;SrcRewrite2=2,1,2,7000001,999999
;Location=0
;Debug=0

[XLX Network]
Enabled=0
