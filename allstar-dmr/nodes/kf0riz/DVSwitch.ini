; DVSwitch.ini -- MMDVM_Bridge partner (AMBE/TLV audio) config -- REFERENCE
;
; This file ships with the mmdvm-bridge package at /opt/MMDVM_Bridge/DVSwitch.ini
; and ALREADY has the correct values below. You almost certainly do NOT need
; to install this copy -- it is here so the full chain is documented in one
; place and the validator can check the pairing.
;
; Verified against the distributed mmdvm-bridge 1.6.8 package, Oct 2026.
; Pairing with Analog_Bridge.ini [AMBE_AUDIO]:
;   MMDVM_Bridge sends   (txPort 31100) -> Analog_Bridge listens (rxPort 31100)
;   Analog_Bridge sends  (txPort 31103) -> MMDVM_Bridge listens (rxPort 31103)

[DMR]
address = 127.0.0.1             ; Address to send AMBE TLV frames to (export)
txPort = 31100                  ; Port to send AMBE TLV frames to (export)
rxPort = 31103                  ; Port to listen on (import)
slot = 2
exportTG = 0
