; usrp-agc -- MAIN chain instance: Asterisk <-> main Analog_Bridge.
; Covers the analog -> digital direction (Asterisk to AB) that
; Analog_Bridge's AUDIO_USE_AGC cannot. AGC on A->B; B->A left raw
; (AB's own usrpAudio AGC/Gain governs that direction as today).
; Port wiring (see xmode/DESIGN.md):
;   Asterisk sends to 34001, listens on 32001 (unchanged) -- the
;   rpt.conf convention USRP/127.0.0.1:34001:32001 (send : listen).
;   Shim A side takes over 34001/32001 toward Asterisk; the AB moves:
;   shim sends to AB rx 32021, AB sends back on its tx 34021 to the
;   shim, shim forwards to Asterisk on 32001.
;   Main Analog_Bridge.ini [USRP] rx/tx become 32021 / 34021
;   (installer makes that one edit, with backup; bypass makes it safe).
;   Ports 32021/34021 were chosen because 32011 is already the main
;   MMDVM_Bridge [P25 Network] LocalPort -- do not "simplify" to 32011.

[shim]
listen_a = 34001
send_a = 32001
listen_b = 34021
send_b = 32021
agc_a_to_b = on
agc_b_to_a = off
state_file = /run/usrp-agc/main.state

[agc]
target_dbfs_rms = -20
max_gain_db = 24
min_gain_db = -6
ceiling_dbfs_peak = -3
gate_dbfs_rms = -50
attack_ms = 5
release_ms = 200
