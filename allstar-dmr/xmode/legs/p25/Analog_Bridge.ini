; Analog_Bridge.ini -- xmode P25 LEG (bridge leg)
; Independent instance for the cross-mode bridge. Mirrors the main
; Analog_Bridge.ini structure; only ports/identity differ.
; USRP side is the bridge crossover: rxPort below is this leg's fixed
; home port; txPort is PARKED at 34299 while unbridged and pointed at
; the bridge shim by xmode-switch.sh while a bridge is up;
; usrpAudio governs network -> PCM audio and can be flipped to
; AUDIO_USE_AGC from the dashboard (usrpGain/usrpAGC below).
; TLV side pairs with this leg's DVSwitch.ini [P25]:
;   AB txPort 32253 -> MB rxPort 32253 ; AB rxPort 32250 <- MB txPort 32250

[GENERAL]
logLevel = 2

[AMBE_AUDIO]
address = 127.0.0.1
txPort = 32253
rxPort = 32250
ambeMode = P25
gatewayDmrId = 3209686
repeaterID = 320968612
; txTg is not this leg's destination control: the bridge helper sets
; the destination in the leg gateway's ini ([Network] Startup) and
; restarts the leg stack. txTg stays 9 (local) here.
txTg = 9
txTs = 2
colorCode = 1

[USRP]
address = 127.0.0.1
txPort = 34299
rxPort = 34221
usrpAudio = AUDIO_USE_GAIN
usrpGain = 1.00
usrpAGC = -20,10,100
tlvAudio = AUDIO_USE_GAIN
tlvGain = 1.00
