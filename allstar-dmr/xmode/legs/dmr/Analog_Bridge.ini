; Analog_Bridge.ini -- xmode DMR LEG (bridge leg)
; Independent instance for the cross-mode bridge. Mirrors the main
; Analog_Bridge.ini structure; only ports/identity differ.
; USRP side is the bridge crossover: rxPort below is this leg's fixed
; home port; txPort is PARKED at 34299 while unbridged and pointed at
; the bridge shim by xmode-switch.sh while a bridge is up;
; usrpAudio governs network -> PCM audio and can be flipped to
; AUDIO_USE_AGC from the dashboard (usrpGain/usrpAGC below).
; TLV side pairs with this leg's DVSwitch.ini [DMR]:
;   AB txPort 31203 -> MB rxPort 31203 ; AB rxPort 31200 <- MB txPort 31200

[GENERAL]
logLevel = 2

[AMBE_AUDIO]
address = 127.0.0.1
txPort = 31203
rxPort = 31200
ambeMode = DMR
gatewayDmrId = 3209686
repeaterID = 320968608
; txTg is the leg's DMR destination, as a DIAL STRING for the leg's own
; DMRGateway (plain = BM, 4+pad = TGIF, 7+pad = KS-DMR -- same dial plan
; as the main node). The bridge helper edits this line + restarts this
; AB to retune the leg. Left empty until the leg is first tuned, so the
; dashboard shows no destination for an untuned leg.
txTg =
txTs = 2
colorCode = 1

[USRP]
address = 127.0.0.1
txPort = 34299
rxPort = 34201
usrpAudio = AUDIO_USE_GAIN
usrpGain = 1.00
usrpAGC = -20,10,100
tlvAudio = AUDIO_USE_GAIN
tlvGain = 1.00
