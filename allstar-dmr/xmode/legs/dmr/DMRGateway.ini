; DMRGateway.ini -- xmode DMR LEG gateway (bridge leg)
; A second DMRGateway instance so the bridge's DMR leg can sit on
; BM / TGIF / KS-DMR independently of the main node. Same networks,
; same dial plan (plain = BM, 4+pad = TGIF, 7+pad = KS-DMR), same
; rewrite rules as the main gateway -- only the local ports and the
; network logins differ: this instance uses its OWN ESSIDs
; (BM 320968608, TGIF 320968609, KS-DMR 320968610) so it never
; collides with the main node's logins (604/602/603).
;
; BEFORE FIRST RUN: the installer fills the two password markers from
; the node's existing main DMRGateway.ini (same recovery pattern as
; deploy-on-node.sh) -- secrets are never stored in this repo.

[General]
Id=3209686
RptAddress=127.0.0.1
RptPort=62132
LocalAddress=127.0.0.1
LocalPort=62131
Timeout=10
RuleTrace=0
Daemon=0
Debug=0

[Log]
DisplayLevel=1

[Info]
Callsign=KF0RIZ
Location=Kansas
Description=KF0RIZ xmode DMR leg gateway
Latitude=39.01
Longitude=-94.77
Height=0
URL=https://github.com/Beerssam/Projects

; --- Network 1: BrandMeister via 3103 (same master as main) ---
[DMR Network 1]
Enabled=1
Name=BM_3103
Address=3103.repeater.net
Port=62031
Password="__SET_BM_HOTSPOT_PASSWORD__"
Id=320968608
TGRewrite1=1,1,1,1,999999
TGRewrite2=2,1,2,1,999999
PCRewrite1=1,9990,1,9990,1
PCRewrite2=2,9990,2,9990,1
PassAllPC=1
PassAllPC=2
Location=0
Debug=0

; --- Network 2: TGIF ---
[DMR Network 2]
Enabled=1
Name=TGIF_Network
Address=tgif.network
Port=62031
Password="__SET_TGIF_PASSWORD__"
Id=320968609
TGRewrite1=1,4000001,1,1,999999
TGRewrite2=2,4000001,2,1,999999
TGRewrite3=1,9000001,1,1000000,9000000
TGRewrite4=2,9000001,2,1000000,9000000
Location=0
Debug=0

; --- Network 3: KS-DMR (TS2 / TG 3120 only on the public entry) ---
[DMR Network 3]
Enabled=1
Name=KSDMR
Address=vesta.k0usy.org
Port=62071
Password="KS-DMR"
Id=320968610
