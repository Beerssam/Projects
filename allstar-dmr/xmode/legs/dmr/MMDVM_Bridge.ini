; MMDVM_Bridge.ini -- xmode DMR LEG (bridge leg)
; Single-mode instance: DMR only, pointed at the leg's OWN DMRGateway
; (127.0.0.1:62131). Modelled on the node's proven multi-mode ini.

[General]
Callsign=KF0RIZ
Id=3209686
Timeout=180
Duplex=0

[Info]
RXFrequency=446000000
TXFrequency=446000000
Power=1
Latitude=39.01
Longitude=-94.77
Height=0
Location=Shawnee, KS
Description=KF0RIZ xmode DMR leg
URL=https://github.com/Beerssam/Projects

[Log]
DisplayLevel=1
FileLevel=2
FilePath=/var/log/mmdvm
FileRoot=MMDVM_Bridge-XDMR

[DMR Id Lookup]
File=/var/lib/mmdvm/DMRIds.dat
Time=24

[NXDN Id Lookup]
File=/var/lib/mmdvm/NXDN.csv
Time=24

[Modem]
Port=/dev/null
RSSIMappingFile=/dev/null
Trace=0
Debug=0

[D-Star]
Enable=0
Module=B

[DMR]
Enable=1
ColorCode=1
EmbeddedLCOnly=1
DumpTAData=0

[System Fusion]
Enable=0

[P25]
Enable=0
NAC=293

[NXDN]
Enable=0
RAN=1

[D-Star Network]
Enable=0
GatewayAddress=127.0.0.1
GatewayPort=20010
LocalPort=20011
Debug=0

[DMR Network]
Enable=1
Address=127.0.0.1
Port=62131
Jitter=360
Local=62132
