Slot1=1
Slot2=1
Debug=0

[System Fusion Network]
Enable=0
LocalAddress=127.0.0.1
LocalPort=3300
GatewayAddress=127.0.0.1
GatewayPort=4300
Debug=0

[P25 Network]
