; USRP2M17.ini -- KF0RIZ M17 bridge (AllStar private node 1998 <-> M17 reflector)
; Installed to /etc/USRP2M17.ini by install-m17.sh. The dashboard's M17 panel
; edits the Name/Address/DstPort lines in [M17 Network] via m17-switch.sh;
; everything else is set here.
;
; Callsign: the bridge's own M17 identity. The letter after the space is the
; client's module identity (the author's sample uses "D"); the reflector
; MODULE you actually join comes from the Name field below, not from here
; (verified in USRP2M17.cpp: the CONN packet's module byte is read from Name).
; Name: "<reflector> <module>" -- e.g. "M17-M17 A".
; Address: reflector host. Resolved from the DVRef mrefd registry: the dns
; name when the reflector publishes one, else its static IPv4. M17-M17
; publishes no dns name; 107.191.121.105 is its static IPv4 (DVRef record,
; ip_source=static, verified Oct 23 2026). DstPort from the same record.
; LocalPort 32012: the author's sample uses 32010, which on THIS node is the
; P25 gateway leg (32010/32011) -- do not change it back.

[M17 Network]
Callsign=KF0RIZ D
Address=107.191.121.105
Name=M17-M17 A
LocalPort=32012
DstPort=17000
GainAdjustdB=3
Daemon=0
Debug=0

[USRP Network]
Address=127.0.0.1
DstPort=32002
LocalPort=34002
GainAdjustdB=-6
Debug=0

[Log]
# Logging levels, 0=No logging, 1=Info
DisplayLevel=1
FileLevel=1
FilePath=/var/log/usrp2m17
FileRoot=USRP2M17
