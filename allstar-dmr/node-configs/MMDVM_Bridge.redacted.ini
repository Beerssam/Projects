; MMDVM_Bridge.ini -- KF0RIZ DMR bridge leg
; Callsign: KF0RIZ | DMR ID: 3209686
; Only the DMR path is used here; other modes stay disabled.
;
; [DMR Network] -- VERIFIED pairing with DMRGateway (see DMRGateway.ini):
;   DMRGateway binds its LocalPort (62031) and only accepts frames whose
;   source port is its RptPort (62032). So this side sends TO 62031 and
;   binds Local=62032. Verified against DMRGateway source (Conf.cpp,
;   MMDVMNetwork.cpp) and the distributed example ini, Oct 2026.

