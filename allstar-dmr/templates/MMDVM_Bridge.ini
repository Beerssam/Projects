; MMDVM_Bridge.ini -- DMR bridge leg (template)
; Render with scripts/generate-configs.sh after filling vars.sh.
; Only the DMR path is used here; leave other modes disabled.
; VERIFY TXPort/RXPort and [DMR Network] Port= against the working config
; that the `dvs` menu generates on YOUR box.

[General]
Callsign=${CALLSIGN}
Id=${DMR_ID}
Timeout=180
Duplex=0
; AMBE audio ports to/from Analog_Bridge (localhost)
TXPort=31103
RXPort=31100

[Info]
RXFrequency=446000000
TXFrequency=446000000
Power=1
Latitude=0.0
Longitude=0.0
Height=0
Location="AllStar DVSwitch Bridge"
Description="Multi-mode DMR via DMRGateway"
URL=""

[Log]
DisplayLevel=0
FileLevel=1
FilePath=/var/log/mmdvm
FileRoot=MMDVM_Bridge

[DMR]
Enable=1
ColorCode=1
EmbeddedLCOnly=1
DumpTAData=0

[DMR Network]
Enable=1
; Local DMRGateway (see templates/DMRGateway.ini [DMR Network] Local=)
; VERIFY: this Port= must match DMRGateway's Local= value.
Address=127.0.0.1
Port=62033
Jitter=300
Local=62032
Password=passw0rd
Slot1=1
Slot2=1
Debug=0

[System Fusion Network]
Enable=0

[P25 Network]
Enable=0

[NXDN Network]
Enable=0
