; DMRGateway.ini -- multi-mode DMR (template)
; Render with scripts/generate-configs.sh after filling vars.sh.
;
; Written for current DMRGateway (github.com/g4klx/DMRGateway, built from
; source -- it is NOT in the DVSwitch apt repo and NOT configured by the
; dvs menu). See scripts/build-dmrgateway.sh.
;
; Local side -- VERIFIED against DMRGateway source (Conf.cpp) and the
; distributed example ini, Oct 2026:
;   [General] RptAddress/RptPort describe the MMDVM client (MMDVM_Bridge).
;   DMRGateway binds LocalPort and accepts DMRD frames ONLY from RptPort.
;   MMDVM_Bridge.ini [DMR Network] must therefore be:
;       Address=127.0.0.1, Port=62031, Local=62032
;   There is NO unnumbered [DMR Network] section in current DMRGateway --
;   every [DMR Network N] is an upstream network. Do not add one.
;
; Rewrite rules: each TGRewrite line auto-creates its inverse for return
; traffic (verified in DMRGateway.cpp). No SrcRewrite: caller radio IDs pass
; through unmodified.

[General]
Id=${DMR_ID}
RptAddress=127.0.0.1
RptPort=62032
LocalAddress=127.0.0.1
LocalPort=62031
Timeout=10
RuleTrace=0
Daemon=0
Debug=0

[Log]
DisplayLevel=1
; DMRGateway logs to stdout/stderr; under systemd: journalctl -u dmrgateway -f

[Info]
Callsign=${CALLSIGN}
Location=${LOCATION}
Description=${CALLSIGN} AllStar DVSwitch multi-mode DMR gateway

; --- Network 1: BrandMeister ---
[DMR Network 1]
Enabled=1
Name=BM_${BM_MASTER_SHORT}
Address=${BM_MASTER}
Port=62031
Password="${BM_PASSWORD}"
Id=${BM_ESSID}
TGRewrite1=1,1,1,1,999999
TGRewrite2=2,1,2,1,999999
PCRewrite1=1,9990,1,9990,1
PCRewrite2=2,9990,2,9990,1
; Pass all other inbound private calls (e.g. BM Parrot 9990 replies) to the repeater
PassAllPC=1
PassAllPC=2
Location=1
Debug=0

; --- Network 2: TGIF ---
[DMR Network 2]
Enabled=1
Name=TGIF_Network
Address=tgif.network
Port=62031
Password="${TGIF_PASSWORD}"
Id=${TGIF_ESSID}
; 4000001-4999999 dialed on the AllStar side -> TGIF TGs 1-999999 (leading 4 stripped)
TGRewrite1=1,4000001,1,1,999999
TGRewrite2=2,4000001,2,1,999999
Location=0
Debug=0

; Add [DMR Network 3] .. [DMR Network 5] the same way for more networks.
; Remember: unique Id per stanza, rewrite rules per stanza.
; IMPORTANT: DMRGateway tries networks IN ORDER (1, 2, 3...) and the first
; matching rewrite wins. If a later network needs a TG inside an earlier
; network's catch-all range, carve that TG out of the earlier range first
; (e.g. split 2,1,2,1,999999 around it), or the traffic will misroute silently.

[XLX Network]
Enabled=0
