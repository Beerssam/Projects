; DMRGateway.ini -- multi-mode DMR (template)
; Render with scripts/generate-configs.sh after filling vars.sh.
;
; VERIFY the [DMR Network] client-side port pairing against the working
; single-network config that the `dvs` menu generates on YOUR box. The values
; below are the common DVSwitch defaults; trust your generated files first.
;
; Multi-mode notes:
;  - Stock DMRGateway supports [DMR Network 1] .. [DMR Network 5] (+ XLX).
;  - Each upstream network needs a UNIQUE DMR Id (use ESSID suffixes, e.g.
;    123456701 for BM, 123456702 for TGIF) or one login gets kicked.
;  - Each stanza needs TGRewrite rules or it passes NOTHING.
;  - Dialing convention below: plain TGs -> BrandMeister (net 1),
;    4xxxxxx -> TGIF (net 2), i.e. 4000777 reaches TGIF TG 777.

[General]
Callsign=${CALLSIGN}
Id=${DMR_ID}
Timeout=10
Duplex=0
Debug=0
Daemon=0

[Log]
DisplayLevel=0
FileLevel=1
FilePath=/var/log/mmdvm
FileRoot=DMRGateway

; Client side: MMDVM_Bridge connects here (localhost).
; VERIFY: Local= must match MMDVM_Bridge.ini [DMR Network] Port=.
[DMR Network]
Enabled=1
Address=127.0.0.1
Port=62031
Local=62032
Password=passw0rd
Location=0
Debug=0

[DMR Network 1]
Enabled=1
Name=BM_${BM_MASTER_SHORT}
Address=${BM_MASTER}
Port=62031
Password="${BM_PASSWORD}"
Id=${BM_ESSID}
TGRewrite1=1,1,1,1,999999
TGRewrite2=2,1,2,1,999999
PCRewrite1=1,9990,1,9990,1
PCRewrite2=2,9990,2,9990,1
TypeRewrite1=1,9990,1,9990
TypeRewrite2=2,9990,2,9990
SrcRewrite1=1,9990,1,1,999999
SrcRewrite2=2,9990,2,1,999999
Location=1
Debug=0

[DMR Network 2]
Enabled=1
Name=TGIF_Network
Address=tgif.network
Port=62031
Password="${TGIF_PASSWORD}"
Id=${TGIF_ESSID}
; 4000001-4999999 on the AllStar side -> TGIF TGs 1-999999 (leading 4 stripped)
TGRewrite1=1,4000001,1,1,999999
TGRewrite2=2,4000001,2,1,999999
; Return-path mirror of the above. VERIFY on-air: if inbound caller IDs or
; talkgroups look wrong, these SrcRewrite lines are the first suspect.
SrcRewrite1=1,1,1,4000001,999999
SrcRewrite2=2,1,2,4000001,999999
Location=0
Debug=0

; Add [DMR Network 3] .. [DMR Network 5] the same way for more networks.
; Remember: unique Id per stanza, rewrite rules per stanza.

[XLX Network]
Enabled=0
