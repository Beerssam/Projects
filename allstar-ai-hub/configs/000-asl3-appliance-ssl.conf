# The appliance's HTTPS site, the default site for every name. It uses the
# self-signed certificate until asl-web-ui's HTTPS page gets a Let's Encrypt
# one: then asl-web-ui writes /etc/asl-web-ui/apache-tls.conf with that
# certificate and certbot's recommended TLS settings
# (/etc/letsencrypt/options-ssl-apache.conf), which replace the ones here.
<IfModule ssl_module>
<VirtualHost *:443>
        DocumentRoot /var/www/html
        LogLevel error
        ErrorLog ${APACHE_LOG_DIR}/error.log
        CustomLog ${APACHE_LOG_DIR}/access.log combined

        # /var/www/html stays the DocumentRoot, as on any Debian Apache, so what
        # admins put there (SuperMon, AllScan, their own pages) keeps working and
        # other packages' Alias/ProxyPass snippets take effect as usual. The
        # appliance claims only / for its landing page and keeps the rest of its
        # files under /asl3/.
        AliasMatch ^/(index\.html)?$ /usr/share/asl3-appliance/web/index.html
        Alias /asl3/ /usr/share/asl3-appliance/web/
        RedirectMatch 301 ^/asl3$ /asl3/

        SSLEngine on
        SSLProtocol             all -SSLv2 -SSLv3 -TLSv1 -TLSv1.1
        SSLCipherSuite          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
        SSLHonorCipherOrder     off
        SSLSessionTickets       off
        SSLOptions              +StrictRequire
        <IfFile !/etc/asl-web-ui/apache-tls.conf>
                SSLCertificateFile      /etc/ssl/certs/ssl-cert-snakeoil.pem
                SSLCertificateKeyFile   /etc/ssl/private/ssl-cert-snakeoil.key
        </IfFile>
        IncludeOptional /etc/asl-web-ui/apache-tls.conf

        ProxyPass /ai-dashboard/ http://127.0.0.1:62573/
        ProxyPassReverse /ai-dashboard/ http://127.0.0.1:62573/

        # AI dashboard API - the dashboard JS fetches these absolute paths, so they must be proxied to the Flask app too, not just /ai-dashboard/.
        ProxyPass "/api/connections" "http://127.0.0.1:62573/api/connections"
        ProxyPassReverse "/api/connections" "http://127.0.0.1:62573/api/connections"
        ProxyPass "/api/aircraft" "http://127.0.0.1:62573/api/aircraft"
        ProxyPassReverse "/api/aircraft" "http://127.0.0.1:62573/api/aircraft"
        ProxyPass "/api/recent" "http://127.0.0.1:62573/api/recent"
        ProxyPassReverse "/api/recent" "http://127.0.0.1:62573/api/recent"
        ProxyPass "/api/ai_status" "http://127.0.0.1:62573/api/ai_status"
        ProxyPassReverse "/api/ai_status" "http://127.0.0.1:62573/api/ai_status"
        ProxyPass "/api/pool" "http://127.0.0.1:62573/api/pool"
        ProxyPassReverse "/api/pool" "http://127.0.0.1:62573/api/pool"
        ProxyPass "/api/health" "http://127.0.0.1:62573/api/health"
        ProxyPassReverse "/api/health" "http://127.0.0.1:62573/api/health"
        ProxyPass "/api/solar" "http://127.0.0.1:62573/api/solar"
        ProxyPassReverse "/api/solar" "http://127.0.0.1:62573/api/solar"
        ProxyPass "/api/trail/" "http://127.0.0.1:62573/api/trail/"
        ProxyPassReverse "/api/trail/" "http://127.0.0.1:62573/api/trail/"
        ProxyPass "/api/route/" "http://127.0.0.1:62573/api/route/"
        ProxyPassReverse "/api/route/" "http://127.0.0.1:62573/api/route/"
        ProxyPass "/stream" "http://127.0.0.1:62573/stream" flushpackets=on
        ProxyPassReverse "/stream" "http://127.0.0.1:62573/stream"
        ProxyPass "/action/" "http://127.0.0.1:62573/action/"
        ProxyPassReverse "/action/" "http://127.0.0.1:62573/action/"
</VirtualHost>
</IfModule>
